[project]
authors = ["Peter Reschenhofer <peter@abteil.org>"]
channels = ["conda-forge"]
description = "Codebase for data wrangling and analyis of https://energie.wifo.ac.at"
name = "explore"
platforms = ["linux-64"]
version = "0.1.0"

[activation.env]
PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig"
	
[tasks]
#load-data = "Rscript load/_run-all.r"
sync-data = "./sync-storage.sh"
export-data = "Rscript export/data/_run-all.r"

sync-export-data = { depends-on = ["sync-data", "export-data"] }

[dependencies]
pyyaml = ">=6.0.3,<7"

numpy = ">=2.5.3,<3"
pandas = ">=3.0.6,<4"
cdsapi = ">=0.7.7,<0.8"
xarray = ">=2026.7.0,<2027"
pip = ">=26.2.1,<27"
python = ">=3.12.14,<3.13"

r-base = ">=4.5.3,<4.6"
r-devtools = ">=2.5.2,<3"
"r-data.table" = ">=1.18.6.1,<2"
r-zoo = ">=1.9_0,<2"
r-tidyverse = ">=2.0.0,<3"
r-jsonlite = ">=2.0.0,<3"
r-googledrive = ">=2.1.2,<3"
r-xml2 = ">=1.6.0,<2"
r-httr = ">=1.4.9,<2"
r-clock = ">=0.7.4,<0.8"
r-librarian = ">=1.8.1,<2"
rsync = ">=3.4.4,<4"
rootpath = ">=0.1.1,<0.2"
libcurl = ">=8.21.0,<9"
zlib = ">=1.3.2,<2"
c-compiler = ">=1.11.0,<2"
cxx-compiler = ">=1.11.0,<2"
r-arrow = ">=25.0.0,<26"
netcdf4 = ">=1.7.4,<2"
dask = ">=2026.7.1,<2027"
nodejs = ">=24.13.0,<24.14"
lftp = ">=4.9.3,<5"
r-readods = ">=2.3.6,<3"
r-logger = ">=0.4.3,<0.5"
